<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブロック崩し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 夜のゲームセンター、明るく軽快
IDEA: 小さなアーケード筐体。画面のまわりに枠とスコア表示
PICTURE: ゲーム画面そのもの（キャンバス）を中央に大きく
COLOUR and TYPE: 深い藍の筐体 + 虹色ブロック + 黄色アクセント / DotGothic16 + M PLUS 1p
LAYOUT: タイトル → 筐体（スコア帯・画面・操作ボタン）→ 遊び方
*/
:root{color-scheme:light dark;--bg:light-dark(#eef0fb,#0a0d24);--ink:light-dark(#141838,#eef0ff);--cab:#161b45;--cab2:#22296a;--screen:#060818;--acc:#ffd23f;--mut:light-dark(#4a5078,#a7add6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "M PLUS 1p",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,12px);max-width:760px;margin:0 auto}
h1{font:400 clamp(32px,6vw,48px)/1.05 "DotGothic16",monospace;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--mut)}
.cab{background:linear-gradient(180deg,var(--cab2),var(--cab));border-radius:22px;padding:14px;box-shadow:0 18px 40px rgba(10,12,40,.35),inset 0 2px 0 rgba(255,255,255,.12)}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;color:#eef0ff;font:400 18px/1.2 "DotGothic16",monospace;padding:4px 8px 12px}
.hud b{color:var(--acc);font-weight:400}
.screen{position:relative;aspect-ratio:4/3;background:var(--screen);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 3px #0003,inset 0 0 40px #000a;touch-action:none}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;background:rgba(6,8,24,.72);padding:20px}
.overlay[hidden]{display:none}
.overlay h2{font:400 clamp(28px,6vw,44px)/1.1 "DotGothic16",monospace;margin:0 0 8px;color:var(--acc)}
.overlay p{margin:0 0 16px;color:#cfd3f5}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:12px}
button{font:700 16px "M PLUS 1p",sans-serif;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--acc);color:#1a1530;cursor:pointer}
button.sub{background:#ffffff1f;color:#eef0ff}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin-top:22px}
.how div{background:light-dark(#fff,#141a40);border-radius:14px;padding:12px 14px}
.how b{display:block}
.how span{color:var(--mut);font-size:15px}
@media(prefers-reduced-motion:reduce){.cab{box-shadow:none}}
</style>
</head>
<body>
<main class="band">
  <h1>ブロック崩し</h1>
  <p class="lead">ボールを打ち返して、すべてのブロックを壊そう。ステージが進むとボールが速くなります。</p>
  <section class="cab" aria-label="ゲーム">
    <div class="hud"><span>スコア <b id="score">0</b></span><span>ハイスコア <b id="best">0</b></span><span>ステージ <b id="stage">1</b></span><span>残り <b id="lives">♥♥♥</b></span></div>
    <div class="screen" id="screen">
      <canvas id="c" width="800" height="600"></canvas>
      <div class="overlay" id="ov">
        <div><h2 id="ovT">スタート</h2><p id="ovP">マウス・タッチ・← → キーでパドルを動かします</p><button id="ovB">ゲームを始める</button></div>
      </div>
    </div>
    <div class="btns"><button class="sub" id="pause">一時停止</button><button class="sub" id="reset">最初から</button></div>
  </section>
  <div class="how">
    <div><b>動かす</b><span>マウス／指でなぞる、または ← → キー</span></div>
    <div><b>発射・一時停止</b><span>スペースキー、または画面タップ</span></div>
    <div><b>コツ</b><span>パドルの端で打つと角度が鋭くなります</span></div>
  </div>
</main>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=600;
const $=id=>document.getElementById(id);
const COLORS=['#ff5d73','#ff9f43','#ffd23f','#5ee38a','#4fc3f7','#8f7bff'];
const COLS=10,BW=68,BH=24,GAP=8,TOP=70;
const LEFT=(W-(COLS*BW+(COLS-1)*GAP))/2;
let best=0;try{best=+localStorage.getItem('breakout-best')||0}catch(e){}
let paddle,ball,bricks,score,lives,stage,state,keys={},particles=[],last=0;

function makeBricks(){
  const rows=Math.min(4+stage,8),list=[];
  for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){
    const hp=(stage>=3&&r<2)?2:1;
    list.push({x:LEFT+c*(BW+GAP),y:TOP+r*(BH+GAP),hp,max:hp,color:COLORS[r%COLORS.length]});
  }
  return list;
}
function resetBall(){ball={x:paddle.x+paddle.w/2,y:paddle.y-9,r:8,vx:0,vy:0,stuck:true}}
function speed(){return 380+stage*45}
function launch(){
  if(!ball.stuck)return;
  const a=(-60+Math.random()*30)*Math.PI/180;
  ball.vx=Math.sin(a+Math.PI/2)*speed()*(Math.random()<.5?-1:1)*.6;
  ball.vy=-speed();ball.stuck=false;
  const n=Math.hypot(ball.vx,ball.vy);ball.vx*=speed()/n;ball.vy*=speed()/n;
}
function newGame(){
  score=0;lives=3;stage=1;
  paddle={w:120,h:14,x:W/2-60,y:H-40};
  bricks=makeBricks();resetBall();hud();
}
function nextStage(){stage++;paddle.w=Math.max(80,120-(stage-1)*8);bricks=makeBricks();resetBall();hud()}
function hud(){
  $('score').textContent=score;$('stage').textContent=stage;
  $('lives').textContent='♥'.repeat(Math.max(lives,0))||'-';
  if(score>best){best=score;try{localStorage.setItem('breakout-best',best)}catch(e){}}
  $('best').textContent=best;
}
function overlay(t,p,b){$('ovT').textContent=t;$('ovP').textContent=p;$('ovB').textContent=b;$('ov').hidden=false}
function start(){$('ov').hidden=true;if(state==='over'||state==='title')newGame();state='play';$('pause').textContent='一時停止'}
function togglePause(){
  if(state==='play'){state='pause';overlay('一時停止','続きから遊べます','再開する');$('pause').textContent='再開'}
  else if(state==='pause'){state='play';$('ov').hidden=true;$('pause').textContent='一時停止'}
}
function burst(x,y,color){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:.5,color})}

function update(dt){
  const ps=620;
  if(keys.ArrowLeft)paddle.x-=ps*dt;
  if(keys.ArrowRight)paddle.x+=ps*dt;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return}
  // 細かく分割して貫通を防ぐ
  const steps=Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/4);
  for(let s=0;s<steps;s++){
    const d=dt/steps;ball.x+=ball.vx*d;ball.y+=ball.vy*d;
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
    if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
    // パドル
    if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){
      const hit=((ball.x-paddle.x)/paddle.w)*2-1;
      const ang=Math.max(-1,Math.min(1,hit))*65*Math.PI/180;
      const sp=speed();ball.vx=Math.sin(ang)*sp;ball.vy=-Math.cos(ang)*sp;ball.y=paddle.y-ball.r;
    }
    // ブロック
    for(const b of bricks){
      if(b.hp<=0)continue;
      const cx=Math.max(b.x,Math.min(ball.x,b.x+BW)),cy=Math.max(b.y,Math.min(ball.y,b.y+BH));
      const dx=ball.x-cx,dy=ball.y-cy;
      if(dx*dx+dy*dy<=ball.r*ball.r){
        const ox=Math.min(Math.abs(ball.x-b.x),Math.abs(ball.x-(b.x+BW)));
        const oy=Math.min(Math.abs(ball.y-b.y),Math.abs(ball.y-(b.y+BH)));
        if(ox<oy)ball.vx=-ball.vx;else ball.vy=-ball.vy;
        b.hp--;score+=b.hp<=0?10*stage:5;
        if(b.hp<=0)burst(b.x+BW/2,b.y+BH/2,b.color);
        hud();break;
      }
    }
    if(ball.y>H+ball.r){
      lives--;hud();
      if(lives<=0){state='over';overlay('ゲームオーバー','スコア '+score+' 点','もう一度遊ぶ');return}
      resetBall();return;
    }
  }
  if(bricks.every(b=>b.hp<=0)){state='clear';overlay('ステージ '+stage+' クリア！','次はボールが少し速くなります','次のステージへ')}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景グリッド
  ctx.strokeStyle='rgba(120,130,255,.07)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const b of bricks){
    if(b.hp<=0)continue;
    ctx.globalAlpha=b.hp<b.max?.55:1;
    ctx.fillStyle=b.color;rr(b.x,b.y,BW,BH,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';rr(b.x+3,b.y+3,BW-6,5,3);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.18)';rr(b.x,b.y+BH-5,BW,5,3);ctx.fill();
    if(b.max>1&&b.hp===b.max){ctx.strokeStyle='#fff';ctx.lineWidth=2;rr(b.x+1,b.y+1,BW-2,BH-2,5);ctx.stroke()}
    ctx.globalAlpha=1;
  }
  for(const p of particles){ctx.globalAlpha=Math.max(p.life*2,0);ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6)}
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);g.addColorStop(0,'#fff3b0');g.addColorStop(1,'#ffb020');
  ctx.fillStyle=g;rr(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();
  ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  if(state==='play'&&ball.stuck){ctx.fillStyle='#cfd3f5';ctx.font='22px "DotGothic16",monospace';ctx.textAlign='center';ctx.fillText('スペース または タップで発射',W/2,H/2+60)}
}
function loop(t){
  const dt=Math.min((t-last)/1000,1/30);last=t;
  if(state==='play')update(dt);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
  draw();requestAnimationFrame(loop);
}
function movePointer(e){
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W;
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
}
cv.addEventListener('pointermove',movePointer);
cv.addEventListener('pointerdown',e=>{movePointer(e);if(state==='play')launch()});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=true;e.preventDefault()}
  if(e.code==='Space'){e.preventDefault();if(state==='play'&&ball.stuck)launch();else if(state==='play'||state==='pause')togglePause();else $('ovB').click()}
});
addEventListener('keyup',e=>{keys[e.key]=false});
$('ovB').addEventListener('click',()=>{
  if(state==='pause')return togglePause();
  if(state==='clear'){nextStage();$('ov').hidden=true;state='play';return}
  start();
});
$('pause').addEventListener('click',togglePause);
$('reset').addEventListener('click',()=>{state='title';newGame();overlay('スタート','マウス・タッチ・← → キーでパドルを動かします','ゲームを始める')});
state='title';newGame();requestAnimationFrame(t=>{last=t;loop(t)});
}
</script>
</body>
</html>
